<!DOCTYPE html>
<html>
        <head>
                <meta charset="utf-8">
                <title>Smart Room Project</title>
                <style>
			.caja-titulo{
				width: 100%;
				box-sizing: border-box;
				border: 1px dashed black;
				padding: 15px;
				margin-bottom: 20px;
				text-align: center;
				font-size: 120%;
			}           
                        .caja-habitacion{
                                float: left;
                                width: 49%;
                                box-sizing: border-box;
                                border: 1px dashed black;
                                padding: 5px;
				margin-bottom: 20px;
                        }
                        
                        .caja-sensores{
                                float: right;
                                width: 49%;
                                box-sizing: border-box;
				border: 1px dashed black;
                                padding: 5px;
				margin-bottom: 20px;
                        }                        
                        .campo-formulario{
                                float: right;
                                width: 65%;
                                box-sizing: border-box;
                        }
			.caja-pie{
                                width: 100%;
				box-sizing: border-box;
				border: 1px dashed black;
				padding: 5px;
                                text-align: center;
				clear: both;
			}
                </style>
        </head>
        <body>
                <header class="caja-titulo">
                        <h1>Smart Room Project</h1>
                </header>

                <main>
			<form>
				<section class="caja-habitacion">
        	                        <h2 style="text-align:center; background-color:lightblue">
                	                        Datos de la habitación
                        	        </h2>
	                                        País: <input list="países" class="campo-formulario"><br><br>
        	                                <datalist id="países">
                	                                <option value="España">
                        	                        <option value="Portugal">
                                	                <option value="Francia">
                                        	        <option value="Italia">
                                                	<option value="Grecia">
	                                        </datalist>                                
	                                        Ciudad: <input name="ciudad" type="text" class="campo-formulario"><br><br>
        	                                Coordenadas GPS: <input name="coordenadas" type="text" class="campo-formulario"><br><br>
                	                        URL: <input name="url" type="text" class="campo-formulario"><br><br>
                        	                Foto: <input name="foto" type="file" class="campo-formulario"><br><br>
                                	        Password: <input name="contraseña" type="password" class="campo-formulario"><br><br>
	                                        <div style="text-align:center; padding-top:10px;">
        	                                        <input value="Enviar Datos" type="Submit">
                	                        </div>
                        	</section>
	                        <section class="caja-sensores">
        	                        <h2 style="text-align:center; background-color: lightgrey">
                	                        Seleccione los sensores
                        	        </h2>
						<input name="Temperatura" value="yes" type="checkbox"> Temperatura<br>
						<input name="Humedad" value="yes" type="checkbox"> Humedad<br>
						<input name="Sonido" value="yes"  type="checkbox"> Nivel de Sonido<br>
						<input name="Luz" value="yes" type="checkbox"> Nivel de luz<br>
						<input name="Movimiento" value="yes" type="checkbox"> Movimiento<br>
                        	</section>
			</form>
                </main>

                <footer class="caja-pie">
                        <a href="https://uah.es" target="_blank">Universidad de Alcalá</a>
                </footer>
        </body>
</html>
