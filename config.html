<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Smart Room Project</title>
	</head>
	<body>
		<header>
			<h1 style="text-align:center">Smart Room Project</h1>
		</header>

		<main style="clear: both">
			<section style="float:left; width:50%">
				<h2 style="background-color:lightblue; text-align:center">
					Datos de la habitación
				</h2>
				<form>
					País: <input list="países" style="float:right; width:95%"><br><br>
					<datalist id="países">
						<option value="España">
						<option value="Portugal">
						<option value="Francia">
						<option value="Italia">
						<option value="Grecia">
					</datalist>
					Ciudad: <input name="ciudad" type="text" style="float:right; width:93%"><br><br>
					Coordenadas GPS: <input name="coordenadas" type="text" style="float:right; width:85%"><br><br>
					URL: <input name="url" type="text" style="float:right; width:95%"><br><br>
					Foto: <input name="foto" type="file" style="float:right; width:90%"><br><br>
					Contraseña: <input name="contraseña" type="password" style="float:right; width:90%"><br><br>
					<input value="Enviar Datos" type="Submit" style="text-align:center">
				</form>
			</section>

			<section style="float:right; width:50%">
				<h2 style="background-color:lightgrey; text-align:center">
					Seleccione los sensores
				</h2>
			</section>
			
		</main>
		<footer style="clear:both; text-align:center">
			<a href="https://uah.es" target="_blank">Universidad de Alcalá</a>
		</footer>
	</body>
</html>
