<!DOCTYPE html>
<html>
        <head>
                <meta charset="utf-8">
                <title>Smart Room Project</title>
                <style>
                        .cabecera-caja {
                                text-align: center;
                                color: black;
                                font-size: 120%;
                        }                     
                        .caja-izquierda {
                                float: left;
                                width: 50%;
                                box-sizing: border-box;
                                border: 1px dashed black;
                                padding: 15px;
                        }
                        
                        .caja-derecha {
                                float: right;
                                width: 48%;
                                box-sizing: border-box;
                                padding: 15px;
                        }                        
                        .campo-formulario {
                                float: right;
                                width: 65%;
                                box-sizing: border-box;
                        }                                                
	                        .pie-pagina {
                                clear: both;
                                text-align: center;
                                padding-top: 20px;
                        }
                </style>
        </head>
        <body>
                <header>
                        <h1 style="text-align:center">Smart Room Project</h1>
                </header>

                <main>
			<section class="caja-izquierda">
                                <h2 class="cabecera-caja">
                                        Datos de la habitación
                                </h2>
                                <form>
                                        País: <input list="países" class="campo-formulario"><br><br>
                                        <datalist id="países">
                                                <option value="España">
                                                <option value="Portugal">
                                                <option value="Francia">
                                                <option value="Italia">
                                                <option value="Grecia">
                                        </datalist>
                                        
                                        Ciudad: <input name="ciudad" type="text" class="campo-formulario"><br><br>
                                        Coordenadas GPS: <input name="coordenadas" type="text" class="campo-formulario"><br><br>
                                        URL: <input name="url" type="text" class="campo-formulario"><br><br>
                                        Foto: <input name="foto" type="file" class="campo-formulario"><br><br>
                                        Password: <input name="contraseña" type="password" class="campo-formulario"><br><br>
                                        
                                        <div style="text-align:center; padding-top:10px;">
                                                <input value="Enviar Datos" type="Submit">
                                        </div>
                                </form>
                        </section>
                        <section class="caja-derecha">
                                <h2 class="cabecera-caja">
                                        Seleccione los sensores
                                </h2>
                        </section>
                </main>

                <footer class="pie-pagina">
                        <a href="https://uah.es" target="_blank">Universidad de Alcalá</a>
                </footer>
        </body>
</html>
