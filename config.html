<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Smart Room Project</title>
		<link rel="stylesheet" type="text/css" href="css/estilos.css">
		<script type="text/javascript" src="js/datos.js"></script>
	</head>
	<body>
		<header class="caja-titulo">
			<h1>Smart Room Project</h1>
		</header>

		<main class="main-bloque">
			<form action="datos.js" class="form-columnas" novalidate onsubmit="validarFormulario(event)">
				<section class="caja-habitacion">
					<h2 class="estilo-cabecera-habitacion">
						Datos de la habitación
					</h2>

					<div class="campo-en-linea">
						<label for="pais">País:</label>
						<input id="pais" name="pais" list="países" class="campo-formulario">
					</div>
					<datalist id="países">
						<option value="España">
						<option value="Portugal">
						<option value="Francia">
						<option value="Italia">
						<option value="Grecia">
					</datalist>

					<div class="campo-en-linea">
						<label for="ciudad">Ciudad:</label>
						<input id="ciudad" name="ciudad" type="text" class="campo-formulario">
					</div>

					<div class="campo-en-linea">
						<label for="coordenadas">Coordenadas GPS:</label>
						<input id="coordenadas" name="coordenadas" type="text" class="campo-formulario">
					</div>

					<div class="campo-en-linea">
						<label for="url">URL:</label>
						<input id="url" name="url" type="text" class="campo-formulario">
					</div>

					<div class="campo-en-linea">
						<label for="foto">Foto:</label>
						<input id="foto" name="foto" type="file" class="campo-formulario">
					</div>

					<div class="campo-en-linea">
						<label for="contrasena">Password:</label>
						<input id="contrasena" name="contraseña" type="password" class="campo-formulario">
					</div>

					<div style="text-align:center; padding-top:10px;">
						<input value="Enviar Datos" type="Submit">
					</div>
				</section>

				<section class="caja-sensores">
					<h2 class="estilo-cabecera-sensores">
						Seleccione los sensores
					</h2>

					<input id="sensor_temp" name="Temperatura" value="yes" type="checkbox">
					<label for="sensor_temp">Temperatura (Actual: <span id="valor_t_actual">25</span> ºC)</label><br>

					<input id="sensor_hum" name="Humedad" value="yes" type="checkbox">
					<label for="sensor_hum">Humedad</label><br>

					<input id="sensor_luz" name="Luz" value="yes" type="checkbox">
					<label for="sensor_luz">Nivel de luz</label><br>

					<input id="sensor_son" name="Sonido" value="yes" type="checkbox">
					<label for="sensor_son">Nivel de sonido</label><br>

					<input id="sensor_mov" name="Movimiento" value="yes" type="checkbox">
					<label for="sensor_mov">Movimiento</label>

					<p class="estilo-alertas">Configura alertas</p>

					<div class="campo-en-linea">
						<label for="t_maxima">Temperatura máxima</label>
						<input id="t_maxima" name="t_maxima" min="-20" max="45" step="1" type="number" onchange="diferenciaTemp()">
					</div>

					<div class="campo-en-linea">
						<label for="t_minima">Temperatura mínima</label>
						<input id="t_minima" name="t_minima" min="-20" max="45" step="1" type="number" onchange="diferenciaTemp()">
					</div>

					<label for="diferencia">Diferencia:</label>
					<output id="diferencia"></output><br><br>
				</section>
			</form>
		</main>

		<footer class="caja-pie">
			<a href="index.html">Volver al Inicio</a><br><br>
			<a href="https://uah.es" target="_blank">Universidad de Alcalá</a>
		</footer>
		<dialog id="modalErrores">
			<p id="mensajeError"></p>
			<button type="button" onclick="document.getElementById('modalErrores').close()">
				Aceptar
			</button>
		</dialog>
	</body>
</html>
