<!DOCTYPE html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Smart Room Project - Nombre y correo</title>
	<link rel="stylesheet" href="css/estilos.css">
	<script src="js/datos.js"></script>
</head>
<body>
	<header class="caja-titulo">
		<h1>Smart Room Project</h1>
	</header>

	<main class="main-bloque">
		<section class="caja-formulario">
			<h2 class="estilo-cabecera">Configuración de Nombre</h2>

			<form onsubmit="guardarNombre(event)">
				<div class="campo-en-linea">
					<label for="nombre">Ingrese su nombre:</label>
					<input type="text" id="nombre" class="campo-formulario" required>
				</div>

				<div style="text-align: center; margin-bottom: 30px;">
					<button type="submit">Guardar nombre</button>
				</div>
			</form>

			<h2 class="estilo-cabecera">Verificar correo electrónico</h2>

			<div class="campo-en-linea">
				<label for="email">Correo:</label>
				<input type="text" id="email" class="campo-formulario" placeholder="usuario@gmail.com" autocomplete="email">
			</div>

			<div style="text-align: center; margin-bottom: 20px;">
				<button type="button" onclick="comprobarEmail(false)" style="margin-right: 10px;">
					Validar con cadenas
				</button>

				<button type="button" onclick="comprobarEmail(true)">
					Validar con expresión regular
				</button>
			</div>

			<p id="resultadoEmail" role="status" aria-live="polite" style="font-weight: bold; text-align:center"></p>

		</section>
	</main>

	<footer class="caja-pie">
		<a href="index.html">Volver al Inicio</a>
		<a href="https://uah.es" target="_blank">
			Universidad de Alcalá
		</a>
	</footer>

	<dialog id="modalErrores" aria-labelledby="tituloModal">
		<h2 id="tituloModal">Información</h2>
		<p id="mensajeError"></p>
		<button type="button" onclick="cerrarModal()">Aceptar</button>
	</dialog>
</body>
</html>
