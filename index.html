<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Smart Room Project</title>
		<link rel="stylesheet" type="text/css" href="css/estilos.css">
	</head>
	<body>
		<header class="caja-titulo">
			<h1>Smart Room Project</h1>
		</header>

		<nav class="caja-menus">
			<a class="caja-menu_n" href="config.html">Menu Configuración</a>
			<a class="caja-menu_n" href="minombre.html">Menu Nombre</a>
			<a class="caja-menu_n" href="#">Menu 3</a>
			<a class="caja-menu_n" href="#">Menu 4</a>

			<aside class="caja-info">
				<a class="caja-menu_n" id="info_nombre" href="#">Información</a>
			</aside>
		</nav>

		<main class="main-columnas">
			<section class="caja-habitacion">
				<h2 class="estilo-cabecera-habitacion">Datos de la habitación</h2>
				<ul>
					<li>País</li>
					<li>Ciudad</li>

				<ul>
					<li>Temperatura</li>
					<li>etc.</li>
				</ul>
			</section>
		</main>

		<footer class="caja-pie">
			<a href="https://uah.es" target="_blank">Universidad de Alcalá</a>
		</footer>

		<script>
			var nombre_guardado = localStorage.getItem("fname");
			if(nombre_guardado != null){
				document.getElementById("info_nombre").innerHTML = "Hola " + nombre_guardado + ": Bienvenido a Smart Room";
			}
		</script>
	</body>
</html>
