<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Smart Room Project - Galería</title>
        <link rel="stylesheet" href="css/estilos.css">
        <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
        <script src="js/galeria.js" defer></script>
</head>
<body>
        <header class="caja-titulo">
                <h1>Galería de Estaciones Meteorológicas</h1>
        </header>
        <main class="caja-galeria">
                <div class="galeria">
                        <button id="anterior" aria-label="Anterior">&#10094;</button>
                        <div class="galeria-ventana">
                                <div class="galeria-tira">
                                        <div class="foto-contenedor">
                                                <img class="foto-miniatura" src="images/alcala.jpg" alt="Alcalá de Henares">
                                                <div class="foto-info"><p>Alcalá de Henares</p></div>
                                        </div>
                                        <div class="foto-contenedor">
                                                <img class="foto-miniatura" src="images/bucarest.jpg" alt="Bucarest">
                                                <div class="foto-info"><p>Bucarest</p></div>
                                        </div>
                                        <div class="foto-contenedor">
                                                <img class="foto-miniatura" src="images/escuela-politecnica.jpg" alt="Escuela Politécnica UAH">
                                                <div class="foto-info"><p>Escuela Politécnica UAH</p></div>
                                        </div>
                                        <div class="foto-contenedor">
                                                <img class="foto-miniatura" src="images/madrid.jpg" alt="Madrid">
                                                <div class="foto-info"><p>Madrid</p></div>
                                        </div>
                                        <div class="foto-contenedor">
                                                <img class="foto-miniatura" src="images/munich.jpg" alt="Múnich">
                                                <div class="foto-info"><p>Múnich</p></div>
                                        </div>
                                        <div class="foto-contenedor">
                                                <img class="foto-miniatura" src="images/oslo.jpg" alt="Oslo">
                                                <div class="foto-info"><p>Oslo</p></div>
                                        </div>
                                </div>
                        </div>
                        <button id="siguiente" aria-label="Siguiente">&#10095;</button>
                </div>
        </main>
        <footer class="caja-pie">
                <a href="index.html">Volver al Inicio</a>
                <a href="https://uah.es" target="_blank">Universidad de Alcalá</a>
        </footer>
</body>
</html>
